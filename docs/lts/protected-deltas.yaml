version: 2

maintenance_model:
  type: protected-full-sync
  product_branch: main
  operation_mode: manual-ai-assisted
  scheduled_sync: false
  cadence_guidance: frequent_small_syncs_when_requested
  optional_runtime_smoke: manual_huggingface_space
  feature_contract_registry: docs/lts/core-feature-contracts.yaml
  downstream_patch_ledger: docs/lts/downstream-patches.yaml

upstream_source:
  repo: router-for-me/CLIProxyAPI
  branch: main

retained_capabilities:
  - id: full-usage-statistics
    registry_feature: full-usage-statistics-core
    must_keep: true
    markers:
      - usage-statistics-enabled
      - internal/usage/
      - /v0/management/usage
      - /v0/management/usage/export
      - /v0/management/usage/import
    validation:
      - scripts/check-lts-contract.sh
      - go test ./internal/usage ./internal/api/handlers/management ./test -run 'Usage|usage'
    conflict_policy: preserve_or_reapply_lts_usage

  - id: management-usage-api
    registry_feature: management-usage-api
    must_keep: true
    markers:
      - /v0/management/usage
      - /v0/management/usage/export
      - /v0/management/usage/import
      - /v0/management/usage-statistics-enabled
      - CanonicalExportVersion
      - TimingVersionV1
      - timing_version
      - ttfb_ms
      - ttft_ms
      - ttfa_ms
      - uncached_input_tokens
      - schema_version
      - migrated_from_version
      - migrations
      - code
      - usage_version_unsupported
      - usage_shape_invalid
      - usage_v1_token_contract_invalid
      - usage_v1_cache_semantics_ambiguous
      - usage_v2_token_contract_invalid
      - usage_v1_timing_semantics_ambiguous
      - usage_v2_timing_semantics_ambiguous
      - usage_v3_token_contract_invalid
      - usage_v3_timing_contract_invalid
      - usage_aggregate_overflow
    validation:
      - management-usage-response-shape-test
      - export-import-roundtrip-test
      - released-v1-to-v2-migration-matrix
      - invalid-import-no-partial-merge
    conflict_policy: preserve_management_usage_contract

  - id: cpa-panel-lts-compatibility
    registry_feature: panel-release-asset
    must_keep: true
    markers:
      - BlueSkyXN/CPA-Panel-LTS
      - management.html
      - management usage response shape
    validation:
      - panel-response-shape-review
      - go test ./internal/managementasset
    conflict_policy: preserve_panel_compatibility

  - id: release-artifact-provenance
    registry_feature: release-artifact-provenance
    must_keep: true
    markers:
      - exact-tag release source checkout
      - manual workflow and repair tooling pinned from the default branch
      - immutable release tooling SHA passed between jobs
      - release source mismatch guard
      - new Release remains draft until the validated asset set is uploaded
      - published same-name assets are never overwritten; different bytes require a new tag
      - publish assets only after every platform build succeeds
      - manual GHCR backfill preserves latest aliases by default
    validation:
      - scripts/check-lts-contract.sh
      - actionlint release workflows
    conflict_policy: preserve_exact_tag_artifact_provenance

  - id: auth-identity-attribution
    registry_feature: auth-identity-attribution
    must_keep: true
    markers:
      - API key attribution
      - auth source attribution
      - auth_index
    validation:
      - auth-attribution-contract-review
    conflict_policy: preserve_auth_identity_attribution

  - id: config-and-hot-reload-compatibility
    registry_feature: config-compatibility-and-hot-reload
    must_keep: true
    markers:
      - usage-statistics-enabled
      - panel-github-repository
      - config hot reload
    validation:
      - config-compatibility-tests
      - watcher-diff-tests
    conflict_policy: preserve_config_compatibility

  - id: astra-native-responses-controls
    registry_feature: astra-native-responses-controls
    must_keep: true
    markers:
      - configuration_update
      - compaction_trigger
      - parallel_tool_calls
    validation:
      - go test ./internal/util ./internal/thinking ./internal/translator/codex/openai/responses -run 'ResponsesControl|AstraControls|CodexParallel|TranslatedEffort'
    conflict_policy: retain_ordered_native_controls_and_explicit_parallel_false

  - id: astra-catalog-tool-availability
    registry_feature: astra-catalog-tool-availability
    must_keep: true
    markers:
      - gpt-6-astra
      - When available
    validation:
      - go test ./internal/registry -run 'Astra|CatalogRefresh'
    conflict_policy: retain_official_availability_fix_without_freezing_future_model_instructions

lts_owned_features:
  - id: codex-model-fallback
    registry_feature: codex-model-fallback
    maintenance_policy: long-term-maintained
    markers:
      - model-fallback
      - global-targets
      - model_fallback_reason
      - ModelFallbackReason
      - reasoning-continuity
    validation:
      - codex-model-fallback-regression-tests
      - codex-model-fallback-race-tests
    conflict_policy: adapt_lts_feature_to_upstream_auth_and_codex_runtime

  - id: codex-rate-limit-continuity
    registry_feature: codex-rate-limit-continuity
    maintenance_policy: long-term-maintained
    markers:
      - rate-limit-continuity
      - codexRateLimitContinuityStore
      - codexRateLimitContinuityFreshBlocked
      - codexRateLimitContinuityConfirmedCooldown
      - nextLeaseExpiry
      - removeSessionPreservingKey
      - established-success-threshold
    validation:
      - codex-rate-limit-continuity-regression-tests
      - codex-rate-limit-continuity-race-tests
    conflict_policy: adapt_lts_feature_to_upstream_auth_selection_and_session_affinity

  - id: codex-abnormal-reasoning-retry
    registry_feature: codex-abnormal-reasoning-retry
    maintenance_policy: long-term-maintained
    markers:
      - abnormal-reasoning-retry
      - hedged-retry
      - RetryWithoutPenalty
    validation:
      - codex-abnormal-reasoning-regression-tests
      - hedged-retry-race-tests
    conflict_policy: adapt_lts_feature_to_upstream_runtime

  - id: transient-error-cooldown
    registry_feature: transient-error-cooldown-config
    maintenance_policy: long-term-maintained
    markers:
      - transient-error-cooldown-seconds
      - SetTransientErrorCooldownSeconds
    validation:
      - transient-cooldown-config-tests
    conflict_policy: adapt_lts_feature_to_upstream_auth_scheduler

  - id: redis-compatible-usage-queue
    registry_feature: redis-compatible-usage-queue
    maintenance_policy: long-term-maintained-optional-integration
    markers:
      - /v0/management/usage-queue
      - internal/redisqueue/
      - timing_version
      - ttfb_ms
      - ttft_ms
      - ttfa_ms
    validation:
      - redis-usage-queue-contract-tests
    conflict_policy: preserve_queue_without_replacing_full_usage

  - id: commercial-neutral-documentation
    registry_feature: commercial-neutral-documentation
    maintenance_policy: long-term-maintained
    markers:
      - commercial-neutral
      - forbid_grep_ci
    validation:
      - scripts/check-lts-contract.sh
    conflict_policy: preserve_commercial_neutral_docs_and_assets

shared_review_seams:
  - id: provider-runtime-usage-seams
    registry_seam: provider-runtime-usage-seams
    review_required: true
    review_when:
      - request lifecycle changes
      - provider runtime or WebSocket ownership changes
      - model resolution changes
      - token accounting or final usage changes
      - logging metadata changes
    validation:
      - targeted provider/runtime tests
      - usage attribution review
      - go test ./internal/runtime/executor/... ./internal/translator/...
    conflict_policy: absorb_upstream_and_adapt_lts_hooks

sync_rules:
  default_mode: protected_full_sync
  upstream_changes: accept_by_default
  merge_commit_required: true
  squash_forbidden: true
  rebase_forbidden: true
  contract_registry_required: true
  downstream_patch_review_required: true
  patch_provenance_merge_commit_required: true
  forbidden_shortcuts:
    - GitHub Sync fork
    - git pull upstream main on main
    - git checkout upstream/main -- .

runtime_validation_profiles:
  - hf-space-runtime-smoke
