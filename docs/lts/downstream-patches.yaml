patches:
  - id: codex-model-fallback
    reason: Codex usage-limit and model-capacity failures need an opt-in ordered model fallback after same-model credentials are exhausted, including a confirmed-usage-cooldown-only global target list when source mappings cannot deliver, while cross-model retries must not replay model-private reasoning signatures or replay a stream after client-visible delivery.
    introduced_in: 0bd5a46fd34dff4711fe5618afe66c93f316897b
    affected_upstream_range: through 17a65ee5470fbaf0e22fc219381e6a4ae9e07624 (upstream main, 2026-09-01); ca601db0 adds passive quota-signal observation, 7bc16ee3 preserves round-robin successor fairness, fcea738f retains typed WebSocket handshake status, and 12b88f3a adds shared auth/registry epochs and state projection. LTS absorbs those shared improvements, but they do not add typed ordered cross-model fallback, target-model auth reselection, reasoning-continuity reset gates, failure rollback, or post-delivery replay safety, so the patch remains required.
