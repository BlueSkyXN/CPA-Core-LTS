  - id: codex-rate-limit-continuity
    reason: A fresh Codex session can receive usage_limit_reached while previously successful sessions on the same auth/model are still allowed to finish, so Core needs a bounded observation state instead of immediately suspending the auth/model for every session.
    introduced_in: 6ee281422e460ac7d5db8d69ef3fe6b49560e96a
    affected_upstream_range: through 53c1e7e2dd6ddf973098a4e685e852aeebed9fe3 (v7.2.92); upstream now publishes stable selected-auth indexes for CPA trace, but still immediately writes model quota cooldown for every 429 and has no Healthy/FreshBlocked/ConfirmedCooldown phases, established lease plus incumbent evidence, single-canary confirmation, lifecycle invalidation, or continuity generation guard. LTS therefore keeps delayed final-auth publication so fallback and hedge losers cannot become the selected trace or session pin.
    files:
