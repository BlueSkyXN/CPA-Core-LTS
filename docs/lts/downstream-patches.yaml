    affected_upstream_range: through 17a65ee5470fbaf0e22fc219381e6a4ae9e07624 (upstream main, 2026-09-01); 1cc72b9d changes Codex client catalog shaping and fcea738f changes WebSocket handshake error construction, but neither adds an equivalent final OAuth client-identity pass shared by HTTP, compact, streaming, WebSocket, and image paths after model-specific overrides, so the patch remains required.
    files:
      - config.example.yaml
      - internal/runtime/executor/codex_client_identity.go
      - internal/runtime/executor/codex_client_identity_test.go
      - internal/runtime/executor/codex_executor.go
