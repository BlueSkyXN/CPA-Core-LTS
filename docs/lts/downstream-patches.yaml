    affected_upstream_range: through 53c1e7e2dd6ddf973098a4e685e852aeebed9fe3 (v7.2.92); input-ID shortening, Responses Lite normalization, replay isolation, and WebSocket target tracking still do not add an equivalent final OAuth client-identity pass shared by HTTP, compact, streaming, WebSocket, and image paths.
