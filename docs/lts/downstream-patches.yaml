  - id: codex-interactions-service-tier-response
    reason: Codex Interactions requests can send priority service, but the shared response translator hardcodes streaming completion metadata to standard and omits the non-streaming tier instead of reporting the effective outbound or upstream tier.
    introduced_in: be649f04a4a66b952d5210c7cdf74e1d90a12b76
    affected_upstream_range: through 17a65ee5470fbaf0e22fc219381e6a4ae9e07624 (upstream main, 2026-09-01); f8c45c30 maps Claude output_config into Codex request text format and 4b5f1eab exposes plugin WebSocket response events, but neither makes the separate Codex Interactions response translator report effective service_tier for streaming, non-streaming, and DONE-fallback responses, so router-for-me/CLIProxyAPI#4189 remains only partially relevant.
    files:
      - internal/translator/codex/interactions/interactions_codex_response.go
      - internal/translator/codex/interactions/interactions_codex_test.go
    regression_tests:
      - TestConvertInteractionsRequestToCodexNormalizesFastServiceTier
      - TestConvertCodexResponseToInteractionsServiceTierResolution
      - TestConvertCodexResponseToInteractionsDoneFallbackPreservesResolvedServiceTier
      - TestConvertCodexResponseToInteractionsDoneFallbackUsesUpstreamCreatedServiceTier
    upstream_issue_or_pr: router-for-me/CLIProxyAPI#4189
    state: required
    retire_when: Upstream reports the effective Codex service tier consistently for streaming, non-streaming, and DONE-fallback Interactions completions; distinguishes an available outbound request without a tier from unavailable outbound request data; and all listed regression tests pass without the downstream implementation.

