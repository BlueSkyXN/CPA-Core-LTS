  - id: codex-rate-limit-continuity
    reason: A fresh Codex session can receive usage_limit_reached while previously successful sessions on the same auth/model are still allowed to finish, so Core needs a bounded observation state instead of immediately suspending the auth/model for every session.
    introduced_in: 6ee281422e460ac7d5db8d69ef3fe6b49560e96a
    affected_upstream_range: through 17a65ee5470fbaf0e22fc219381e6a4ae9e07624 (upstream main, 2026-09-01); ca601db0 adds passive quota-signal observation, 7bc16ee3 preserves round-robin successor fairness, and 12b88f3a adds auth/registry epoch projection. Those shared signals still do not add Healthy/FreshBlocked/ConfirmedCooldown phases, established lease plus incumbent evidence, single-canary confirmation, scoped lifecycle invalidation, or a continuity generation guard, so LTS keeps the patch required while composing the new projection with delayed final-auth publication and transient-rate-limit exceptions.
    files:
