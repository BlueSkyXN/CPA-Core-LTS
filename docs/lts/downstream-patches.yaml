    affected_upstream_range: through 53c1e7e2dd6ddf973098a4e685e852aeebed9fe3 (v7.2.92); upstream commit 36ed0ca5ce4130efcd7532d86c1386ee11ed0e2d / issue #4410 adds generic endpoint-404 detection and an availability-neutral result path. LTS adopts that classifier, preserves request-scoped error publication and credential fallback for route misses, and leaves explicit model-not-found 404s model-scoped so genuine availability errors still cool down.
    files:
      - sdk/cliproxy/auth/conductor.go
      - sdk/cliproxy/auth/conductor_overrides_test.go
    regression_tests:
      - TestManager_CountTokensGenericNotFoundRecordsFailureWithoutCooldown
      - TestManager_CountTokensNonNotFoundFailuresKeepCooldownPolicy
      - TestManager_CountTokensNotFoundContinuesCredentialFallback
      - TestCountTokensResultErrorScopesOnlyNotFound
    upstream_issue_or_pr: router-for-me/CLIProxyAPI#4410
    state: required
    retire_when: Upstream records generic count_tokens endpoint 404 failures in counters, recent-request history, hooks, and error events without auth or model cooldown; continues credential fallback; keeps explicit model-not-found 404s model-scoped; preserves normal 401, 429, and 5xx penalties; composes with the LTS request-scoped model-routing policy; and all listed regressions pass without the downstream implementation.

  - id: management-logs-bounded-response
    reason: Management log reads need a bounded default and maximum response size without breaking Panel and TUI limits or silently skipping legacy after deltas that exceed one page.
    introduced_in: 6b0f185939f914983514d6a5e62378a8d91164e7
    affected_upstream_range: through 53c1e7e2dd6ddf973098a4e685e852aeebed9fe3 (v7.2.92); upstream leaves an omitted limit unbounded and does not clamp oversized limits or provide lossless bounded pagination for legacy after reads.
