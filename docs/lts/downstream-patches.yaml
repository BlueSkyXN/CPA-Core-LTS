    introduced_in: 0bd5a46fd34dff4711fe5618afe66c93f316897b
    affected_upstream_range: through 09da52ad509e2c18e7b9540db3b98c2214c280aa (v7.2.78-6-g09da52ad); the incomplete-status executor/auth changes add request-scoped error propagation but do not provide typed, configurable cross-model fallback with a conservative reasoning-continuity gate, target-model auth reselection, and pre-delivery streaming boundary.
