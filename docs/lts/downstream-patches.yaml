    reason: Current Codex clients transport one canonical x-codex-turn-metadata snapshot plus flat body and direct header compatibility projections. Core must use its stable session before auth selection and rate-limit continuity while preserving explicit execution-session priority; when xAI is an eligible provider, project that canonical session into the existing execution-session contract before enrichment so credential affinity and the native prompt_cache_key / x-grok-conv-id chain share one identity without overriding a caller execution_session_id or parsing ordinary non-Codex xAI client_metadata; keep off-mode bodies byte-identical, make a body canonical source suppress conflicting direct canonical headers, and project the canonical Session_id over random client fallbacks; keep image conversion from collapsing duplicate metadata carriers or reversing default/override/filter precedence; reject unsafe header projection values; fail closed on unknown startup, SDK builder, and hot-reload config values without losing the last good config; keep projections coherent after credential selection; avoid the legacy identity-confuse partial rewrite on canonical requests; offer explicit workspace passthrough/redact/drop privacy policies; strip Git remote credentials even in passthrough mode; emit only hashed session identity plus auth_index in affinity diagnostics; and prevent workspace enrichment or derived identity headers from entering downstream, upstream, deferred-error, or WebSocket request logs.
