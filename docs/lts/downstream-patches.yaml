    introduced_in: 6e12fb1dd6d522ca80a02644d286d765d7a649bd
    affected_upstream_range: through 17a65ee5470fbaf0e22fc219381e6a4ae9e07624 (upstream main, 2026-09-01); 1cc72b9d correctly filters max and ultra for older Codex clients and centralizes the SDK catalog builder, while 02e3d33c refreshes the embedded client model definitions. Those catalog changes do not replace the downstream provider lookup/tier overlay, model-aware custom-model behavior, payload-override-safe final reasoning.effort, usage/retry alignment, or HTTP/WebSocket enforcement, so the runtime patch remains required.
