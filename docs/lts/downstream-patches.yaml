  - id: codex-rate-limit-continuity
    reason: A fresh Codex session can receive usage_limit_reached while previously successful sessions on the same auth/model are still allowed to finish, so Core needs a bounded observation state instead of immediately suspending the auth/model for every session.
    introduced_in: 6ee281422e460ac7d5db8d69ef3fe6b49560e96a
    affected_upstream_range: through 09da52ad509e2c18e7b9540db3b98c2214c280aa (v7.2.78-6-g09da52ad); upstream centralizes request-scoped error conversion but still immediately writes model quota cooldown for every 429 and has no explicit Healthy/FreshBlocked/ConfirmedCooldown phases, established lease plus incumbent in-flight evidence, single-canary confirmation, lifecycle invalidation, or continuity generation guard integrated with session affinity.
    files:
