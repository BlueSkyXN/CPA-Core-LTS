      - TestRuntimeConfigFromConfigDefaultsConfiguredPluginEnabled
    upstream_issue_or_pr: not-filed
    state: required
    retire_when: Upstream preserves the configured plugin enable default through both YAML parsing and runtime host synthesis, and all listed tests pass without the downstream implementation.

  - id: home-plugin-sync-cancellation
    reason: Canceling a dedicated Home plugin-sync request must close its one-command Redis connection so a client-installed two-minute read deadline cannot overwrite an earlier cancellation deadline and stall shutdown or request cleanup.
    introduced_in: 125cd6c244f1c723781680c23e61edaa88aac5ef
    affected_upstream_range: introduced by b651a1a8fd8ea1a43d061a08b42cef8fa3160179 and upstream-equivalent at ed37aa035cc9aa499e4c9fe75682f31bd733e5c8 (upstream PR #5374), included through 17a65ee5470fbaf0e22fc219381e6a4ae9e07624 (upstream main, 2026-09-01). Upstream now unwraps Home dispatch and TLS connections and closes the underlying dedicated transport on cancellation, preventing a later Redis read deadline from restoring the full plugin-sync timeout. LTS keeps the regression coverage in this sync baseline and marks the patch removable for the required follow-up retirement stage.
    files:
      - internal/home/client.go
      - internal/home/client_test.go
    regression_tests:
      - TestGetPluginSyncCancellationInterruptsRead
      - TestPluginSyncCancelableConnCancellationClosesConnection
      - TestProcessPluginSyncCommandCancellationInterruptsTLSHandshake
    upstream_issue_or_pr: router-for-me/CLIProxyAPI#5374
    state: removable
    retire_when: After this upstream-equivalent baseline is merged, remove the downstream-only cancellation comment and direct wrapper regression in a separate merge-commit PR, retain the upstream cancellation and TLS coverage, and record the removal commit in retired_in.

