name: release

on:
  push:
    tags:
      - 'v*-lts-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build and publish, for example v1-lts-0.0.3'
        required: true
        type: string
      rewrite_release_notes:
        description: 'Replace the title and notes when the Release already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.4'
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
  REWRITE_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.rewrite_release_notes || false }}

jobs:
  validate-release-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Validate GPT-5.6 Ultra compatibility
        run: |
          go test ./internal/registry ./internal/thinking \
            ./internal/runtime/executor ./sdk/api/handlers/openai \
            -run 'GPT56|Ultra|CodexWire' -count=1
      - name: Upload validated models catalog
        uses: actions/upload-artifact@v4
        with:
          name: validated-models-catalog
          path: |
            internal/registry/models/models.json
            internal/registry/models/codex_client_models.json
          if-no-files-found: error
          retention-days: 1

  prepare-release:
    needs: validate-release-catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags
          if [[ "${RELEASE_TAG}" != v*-lts-* ]]; then
            echo "Only Core LTS release tags matching v*-lts-* are supported."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag ${RELEASE_TAG} does not exist."
            exit 1
          fi

          release_exists=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_exists=true
          fi
          if [[ "$release_exists" == "true" && "$REWRITE_RELEASE_NOTES" != "true" ]]; then
            echo "Release ${RELEASE_TAG} already exists; preserving its title and notes."
            exit 0
          fi

          notes_file="$(mktemp)"
          title_file="$(mktemp)"
          trap 'rm -f "$notes_file" "$title_file"' EXIT
          bash scripts/generate-lts-release-notes.sh \
            --tag "${RELEASE_TAG}" \
            --notes-file "$notes_file" \
            --title-file "$title_file"
          title="$(tr -d '\n' < "$title_file")"
          if [[ "$release_exists" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" --title "$title" --notes-file "$notes_file"
          fi

  build-hosted:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: tar.gz
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: tar.gz
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Download validated models catalog
        uses: actions/download-artifact@v4
        with:
          name: validated-models-catalog
          path: internal/registry/models
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "COMMIT=$(git rev-parse --short HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
        run: |
          set -euo pipefail
          binary_name="cli-proxy-api"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="cli-proxy-api.exe"
          fi

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/$binary_name" ./cmd/server/

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "$binary_name" LICENSE README.md README_CN.md config.example.yaml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz dist/CLIProxyAPI_*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$RELEASE_TAG" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --pattern 'sky-cpa-core-lts_*.tar.gz' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip sky-cpa-core-lts_*.tar.gz)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$RELEASE_TAG" "$tmp_dir/checksums.txt" --clobber

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Download validated models catalog
        uses: actions/download-artifact@v4
        with:
          name: validated-models-catalog
          path: internal/registry/models
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "COMMIT=$(git rev-parse --short HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          sky_archive_dir="dist/${TARGET}/sky-archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          sky_archive_name="sky-cpa-core-lts_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir" "$sky_archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.ProductName=sky-cpa-core-lts -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$sky_archive_dir"'/sky-cpa-core-lts" ./cmd/server/

              for binary in "'"$archive_dir"'/cli-proxy-api" "'"$sky_archive_dir"'/sky-cpa-core-lts"; do
                glibc_versions="$(readelf --version-info "$binary" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
                if [[ -n "${glibc_versions}" ]]; then
                  printf "%s GLIBC versions:\n%s\n" "$binary" "${glibc_versions}"
                  max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                  if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                    printf "linux ${GOARCH} binary %s requires GLIBC_%s, expected GLIBC_2.17 or older\n" "$binary" "${max_glibc}" >&2
                    exit 1
                  fi
                fi
              done
            '

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          cp LICENSE README.md README_CN.md config.example.yaml "$sky_archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          tar -C "$sky_archive_dir" -czf "dist/$sky_archive_name" sky-cpa-core-lts LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/CLIProxyAPI_*
            dist/sky-cpa-core-lts_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz dist/sky-cpa-core-lts_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$RELEASE_TAG" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --pattern 'sky-cpa-core-lts_*.tar.gz' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip sky-cpa-core-lts_*.tar.gz)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$RELEASE_TAG" "$tmp_dir/checksums.txt" --clobber

  build-linux-no-plugin:
    name: build linux-${{ matrix.goarch }} no-plugin
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            asset_arch: amd64
          - target: linux-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Download validated models catalog
        uses: actions/download-artifact@v4
        with:
          name: validated-models-catalog
          path: internal/registry/models
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-no-plugin-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-linux-no-plugin-${{ matrix.goarch }}-
            go-linux-no-plugin-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "COMMIT=$(git rev-parse --short HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          sky_archive_dir="dist/${TARGET}/sky-archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          sky_archive_name="sky-cpa-core-lts_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir" "$sky_archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/server/

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.ProductName=sky-cpa-core-lts -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$sky_archive_dir/sky-cpa-core-lts" ./cmd/server/

          for binary in "$archive_dir/cli-proxy-api" "$sky_archive_dir/sky-cpa-core-lts"; do
            if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
              readelf -l "$binary" >&2
              echo "no-plugin linux binary must not require a dynamic interpreter" >&2
              exit 1
            fi
          done

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          cp LICENSE README.md README_CN.md config.example.yaml "$sky_archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          tar -C "$sky_archive_dir" -czf "dist/$sky_archive_name" sky-cpa-core-lts LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/CLIProxyAPI_*
            dist/sky-cpa-core-lts_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz dist/sky-cpa-core-lts_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$RELEASE_TAG" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --pattern 'sky-cpa-core-lts_*.tar.gz' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip sky-cpa-core-lts_*.tar.gz)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$RELEASE_TAG" "$tmp_dir/checksums.txt" --clobber

  build-freebsd:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      TARGET_GOARCH: ${{ matrix.goarch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd-amd64
            goarch: amd64
            asset_arch: amd64
            asset_suffix: ''
            cgo_enabled: true
          - target: freebsd-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
            asset_suffix: _no-plugin
            cgo_enabled: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Download validated models catalog
        uses: actions/download-artifact@v4
        with:
          name: validated-models-catalog
          path: internal/registry/models
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-freebsd-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-freebsd-${{ matrix.goarch }}-
            go-freebsd-
      - name: Generate Build Metadata
        id: metadata
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "RELEASE_VERSION=$release_version"
            echo "COMMIT=$commit"
            echo "BUILD_DATE=$build_date"
          } >> "$GITHUB_ENV"
          {
            echo "release_version=$release_version"
            echo "commit=$commit"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare FreeBSD output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "dist/${TARGET}"
      - name: Install FreeBSD cross-build dependencies
        if: ${{ matrix.cgo_enabled }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld wget
      - name: Build FreeBSD binary with CGO
        if: ${{ matrix.cgo_enabled }}
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        with:
          dir: .
          packages: ./cmd/server/
          targets: ${{ env.TARGET }}
          out-dir: dist/${{ env.TARGET }}/bin
          output: cli-proxy-api
          flags: >-
            -ldflags=-s -w
            -X main.Version=${{ steps.metadata.outputs.release_version }}
            -X main.Commit=${{ steps.metadata.outputs.commit }}
            -X main.BuildDate=${{ steps.metadata.outputs.build_date }}
      - name: Build FreeBSD no-plugin binary
        if: ${{ !matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          CGO_ENABLED=0 GOOS=freebsd GOARCH="$TARGET_GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/server/
      - name: Package FreeBSD archive
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_freebsd_${ASSET_ARCH}${ASSET_SUFFIX}.tar.gz"
          mkdir -p "$archive_dir"

          echo "Packaging ${archive_name}"
          cp "dist/${TARGET}/bin/cli-proxy-api" "$archive_dir/cli-proxy-api"
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$RELEASE_TAG" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --pattern 'sky-cpa-core-lts_*.tar.gz' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip sky-cpa-core-lts_*.tar.gz)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$RELEASE_TAG" "$tmp_dir/checksums.txt" --clobber

  publish-checksums:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-hosted
      - build-linux-glibc
      - build-linux-no-plugin
      - build-freebsd
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish final checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip sky-cpa-core-lts_*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No release archives found"
            exit 0
          fi
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          gh release upload "$RELEASE_TAG" checksums.txt --clobber
