name: release

on:
  push:
    tags:
      - 'v*-lts-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build and publish, for example v1-lts-0.0.3'
        required: true
        type: string
      rewrite_release_notes:
        description: 'Replace the title and notes when the Release already exists'
        required: false
        default: false
        type: boolean
      allow_known_historical_catalog_failure:
        description: 'Allow the known GPT-5.6 Ultra test failure in v1-lts-0.0.10 and v1-lts-0.0.11'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.4'
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
  RELEASE_TOOLING_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}
  REWRITE_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.rewrite_release_notes || false }}
  ALLOW_KNOWN_HISTORICAL_CATALOG_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_known_historical_catalog_failure || false }}

jobs:
  validate-release-catalog:
    runs-on: ubuntu-latest
    outputs:
      release_tooling_sha: ${{ steps.release_tooling.outputs.sha }}
    steps:
      - name: Verify manual workflow source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual release repair must run from the default branch ${DEFAULT_BRANCH}; select the historical product tag through release_tag." >&2
            exit 1
          fi
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Checkout current release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TOOLING_REF }}
          path: _release_tools
          fetch-depth: 0
          fetch-tags: true
      - name: Pin release tooling commit
        id: release_tooling
        shell: bash
        run: echo "sha=$(git -C _release_tools rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != v*-lts-* ]]; then
            echo "Only Core LTS release tags matching v*-lts-* are supported." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Release source mismatch: HEAD=${head_commit}, ${RELEASE_TAG}=${tag_commit}." >&2
            exit 1
          fi
          echo "Verified ${RELEASE_TAG} at ${tag_commit}."
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        run: |
          (
            cd _release_tools
            MODEL_CATALOG_DIR="$GITHUB_WORKSPACE/internal/registry/models" \
              bash .github/scripts/refresh-model-catalogs.sh
          )
      - name: Validate GPT-5.6 Ultra compatibility
        shell: bash
        run: |
          set -euo pipefail
          validation_log="$RUNNER_TEMP/gpt56-catalog-validation.log"
          if go test ./internal/registry ./internal/thinking \
            ./internal/runtime/executor ./sdk/api/handlers/openai \
            -run 'GPT56|Ultra|CodexWire' -count=1 2>&1 | tee "$validation_log"; then
            exit 0
          fi

          if [[ "$ALLOW_KNOWN_HISTORICAL_CATALOG_FAILURE" != "true" ]]; then
            exit 1
          fi
          case "$RELEASE_TAG" in
            v1-lts-0.0.10|v1-lts-0.0.11) ;;
            *)
              echo "The catalog validation exception is restricted to v1-lts-0.0.10 and v1-lts-0.0.11." >&2
              exit 1
              ;;
          esac

          failed_packages="$(awk '$1 == "FAIL" && NF > 1 {print $2}' "$validation_log" | sort -u)"
          expected_package="github.com/router-for-me/CLIProxyAPI/v7/internal/thinking"
          if [[ "$failed_packages" != "$expected_package" ]]; then
            printf 'Unexpected failing packages:\n%s\n' "$failed_packages" >&2
            exit 1
          fi

          expected_failures=(
            "--- FAIL: TestGPT56UltraCodexThinking"
            "--- FAIL: TestGPT56UltraCodexThinking/sol_body"
            "--- FAIL: TestGPT56UltraCodexThinking/sol_suffix_overrides_body"
            "--- FAIL: TestGPT56UltraCodexThinking/terra_body"
            "--- FAIL: TestGPT56UltraCodexThinking/terra_suffix_overrides_body"
          )
          failure_count="$(grep -Fc -- '--- FAIL:' "$validation_log")"
          if [[ "$failure_count" -ne "${#expected_failures[@]}" ]]; then
            echo "Unexpected number of historical catalog test failures: $failure_count." >&2
            exit 1
          fi
          for marker in "${expected_failures[@]}"; do
            if ! grep -Fq -- "$marker" "$validation_log"; then
              echo "Missing expected historical catalog failure: $marker" >&2
              exit 1
            fi
          done
          echo "::warning::Accepted the known immutable-tag GPT-5.6 Ultra test failure for $RELEASE_TAG."
      - name: Upload validated models catalog
        uses: actions/upload-artifact@v4
        with:
          name: validated-models-catalog
          path: |
            internal/registry/models/models.json
            internal/registry/models/codex_client_models.json
          if-no-files-found: error
          retention-days: 1

  prepare-release:
    needs: validate-release-catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Checkout current release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release-catalog.outputs.release_tooling_sha }}
          path: _release_tools
          fetch-depth: 0
          fetch-tags: true
      - name: Generate release metadata when required
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags
          if [[ "${RELEASE_TAG}" != v*-lts-* ]]; then
            echo "Only Core LTS release tags matching v*-lts-* are supported." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag ${RELEASE_TAG} does not exist." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 && [[ "$REWRITE_RELEASE_NOTES" != "true" ]]; then
            echo "Release ${RELEASE_TAG} already exists; its title and notes will be preserved."
            exit 0
          fi

          bash _release_tools/scripts/generate-lts-release-notes.sh \
            --tag "${RELEASE_TAG}" \
            --notes-file "$GITHUB_WORKSPACE/release-notes.md" \
            --title-file "$GITHUB_WORKSPACE/release-title.txt"
          title="$(tr -d '\r\n' < release-title.txt)"
          if [[ -z "$title" || ! -s release-notes.md ]]; then
            echo "Generated release metadata is empty." >&2
            exit 1
          fi
      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release-notes.md
            release-title.txt
          if-no-files-found: ignore
          retention-days: 1

  build-hosted:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: tar.gz
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: tar.gz
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Download validated models catalog
        uses: actions/download-artifact@v4
        with:
          name: validated-models-catalog
          path: internal/registry/models
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Release source mismatch: HEAD=${head_commit}, ${RELEASE_TAG}=${tag_commit}." >&2
            exit 1
          fi
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "COMMIT=$(git rev-parse --short "$tag_commit")"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
        run: |
          set -euo pipefail
          binary_name="cli-proxy-api"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="cli-proxy-api.exe"
          fi

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/$binary_name" ./cmd/server/

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "$binary_name" LICENSE README.md README_CN.md config.example.yaml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Download validated models catalog
        uses: actions/download-artifact@v4
        with:
          name: validated-models-catalog
          path: internal/registry/models
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Release source mismatch: HEAD=${head_commit}, ${RELEASE_TAG}=${tag_commit}." >&2
            exit 1
          fi
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "COMMIT=$(git rev-parse --short "$tag_commit")"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          sky_archive_dir="dist/${TARGET}/sky-archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          sky_archive_name="sky-cpa-core-lts_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir" "$sky_archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.ProductName=sky-cpa-core-lts -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$sky_archive_dir"'/sky-cpa-core-lts" ./cmd/server/

              for binary in "'"$archive_dir"'/cli-proxy-api" "'"$sky_archive_dir"'/sky-cpa-core-lts"; do
                glibc_versions="$(readelf --version-info "$binary" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
                if [[ -n "${glibc_versions}" ]]; then
                  printf "%s GLIBC versions:\n%s\n" "$binary" "${glibc_versions}"
                  max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                  if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                    printf "linux ${GOARCH} binary %s requires GLIBC_%s, expected GLIBC_2.17 or older\n" "$binary" "${max_glibc}" >&2
                    exit 1
                  fi
                fi
              done
            '

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          cp LICENSE README.md README_CN.md config.example.yaml "$sky_archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          tar -C "$sky_archive_dir" -czf "dist/$sky_archive_name" sky-cpa-core-lts LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/CLIProxyAPI_*
            dist/sky-cpa-core-lts_*
          if-no-files-found: error

  build-linux-no-plugin:
    name: build linux-${{ matrix.goarch }} no-plugin
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            asset_arch: amd64
          - target: linux-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Download validated models catalog
        uses: actions/download-artifact@v4
        with:
          name: validated-models-catalog
          path: internal/registry/models
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-no-plugin-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-linux-no-plugin-${{ matrix.goarch }}-
            go-linux-no-plugin-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Release source mismatch: HEAD=${head_commit}, ${RELEASE_TAG}=${tag_commit}." >&2
            exit 1
          fi
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "COMMIT=$(git rev-parse --short "$tag_commit")"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          sky_archive_dir="dist/${TARGET}/sky-archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          sky_archive_name="sky-cpa-core-lts_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir" "$sky_archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/server/

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.ProductName=sky-cpa-core-lts -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$sky_archive_dir/sky-cpa-core-lts" ./cmd/server/

          for binary in "$archive_dir/cli-proxy-api" "$sky_archive_dir/sky-cpa-core-lts"; do
            if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
              readelf -l "$binary" >&2
              echo "no-plugin linux binary must not require a dynamic interpreter" >&2
              exit 1
            fi
          done

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          cp LICENSE README.md README_CN.md config.example.yaml "$sky_archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          tar -C "$sky_archive_dir" -czf "dist/$sky_archive_name" sky-cpa-core-lts LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/CLIProxyAPI_*
            dist/sky-cpa-core-lts_*
          if-no-files-found: error

  build-freebsd:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      TARGET_GOARCH: ${{ matrix.goarch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd-amd64
            goarch: amd64
            asset_arch: amd64
            asset_suffix: ''
            cgo_enabled: true
          - target: freebsd-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
            asset_suffix: _no-plugin
            cgo_enabled: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Download validated models catalog
        uses: actions/download-artifact@v4
        with:
          name: validated-models-catalog
          path: internal/registry/models
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-freebsd-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-freebsd-${{ matrix.goarch }}-
            go-freebsd-
      - name: Generate Build Metadata
        id: metadata
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Release source mismatch: HEAD=${head_commit}, ${RELEASE_TAG}=${tag_commit}." >&2
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          commit="$(git rev-parse --short "$tag_commit")"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "RELEASE_VERSION=$release_version"
            echo "COMMIT=$commit"
            echo "BUILD_DATE=$build_date"
          } >> "$GITHUB_ENV"
          {
            echo "release_version=$release_version"
            echo "commit=$commit"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare FreeBSD output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "dist/${TARGET}"
      - name: Install FreeBSD cross-build dependencies
        if: ${{ matrix.cgo_enabled }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld wget
      - name: Build FreeBSD binary with CGO
        if: ${{ matrix.cgo_enabled }}
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        with:
          dir: .
          packages: ./cmd/server/
          targets: ${{ env.TARGET }}
          out-dir: dist/${{ env.TARGET }}/bin
          output: cli-proxy-api
          flags: >-
            -ldflags=-s -w
            -X main.Version=${{ steps.metadata.outputs.release_version }}
            -X main.Commit=${{ steps.metadata.outputs.commit }}
            -X main.BuildDate=${{ steps.metadata.outputs.build_date }}
      - name: Build FreeBSD no-plugin binary
        if: ${{ !matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          CGO_ENABLED=0 GOOS=freebsd GOARCH="$TARGET_GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/server/
      - name: Package FreeBSD archive
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_freebsd_${ASSET_ARCH}${ASSET_SUFFIX}.tar.gz"
          mkdir -p "$archive_dir"

          echo "Packaging ${archive_name}"
          cp "dist/${TARGET}/bin/cli-proxy-api" "$archive_dir/cli-proxy-api"
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error

  publish-release-assets:
    runs-on: ubuntu-latest
    needs:
      - validate-release-catalog
      - build-hosted
      - build-linux-glibc
      - build-linux-no-plugin
      - build-freebsd
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Checkout pinned release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release-catalog.outputs.release_tooling_sha }}
          path: _release_tools
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate and publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          release_version="${RELEASE_TAG#v}"
          expected=(
            "CLIProxyAPI_${release_version}_darwin_amd64.tar.gz"
            "CLIProxyAPI_${release_version}_darwin_aarch64.tar.gz"
            "CLIProxyAPI_${release_version}_windows_amd64.zip"
            "CLIProxyAPI_${release_version}_windows_aarch64.zip"
            "CLIProxyAPI_${release_version}_linux_amd64.tar.gz"
            "CLIProxyAPI_${release_version}_linux_aarch64.tar.gz"
            "CLIProxyAPI_${release_version}_linux_amd64_no-plugin.tar.gz"
            "CLIProxyAPI_${release_version}_linux_aarch64_no-plugin.tar.gz"
            "sky-cpa-core-lts_${release_version}_linux_amd64.tar.gz"
            "sky-cpa-core-lts_${release_version}_linux_aarch64.tar.gz"
            "sky-cpa-core-lts_${release_version}_linux_amd64_no-plugin.tar.gz"
            "sky-cpa-core-lts_${release_version}_linux_aarch64_no-plugin.tar.gz"
            "CLIProxyAPI_${release_version}_freebsd_amd64.tar.gz"
            "CLIProxyAPI_${release_version}_freebsd_aarch64_no-plugin.tar.gz"
          )
          archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip sky-cpa-core-lts_*.tar.gz)
          if [[ ${#archives[@]} -ne ${#expected[@]} ]]; then
            printf 'Expected %s release archives, found %s.\n' "${#expected[@]}" "${#archives[@]}" >&2
            printf '  found: %s\n' "${archives[@]}" >&2
            exit 1
          fi
          for asset in "${expected[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing expected release asset: $asset" >&2
              exit 1
            fi
          done

          expected_commit="$(git rev-parse --short "${RELEASE_TAG}^{commit}")"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          tar -C "$verify_dir" -xzf "CLIProxyAPI_${release_version}_linux_amd64.tar.gz" cli-proxy-api
          version_output="$("$verify_dir/cli-proxy-api" --help 2>&1)"
          version_line="$(printf '%s\n' "$version_output" | sed -n '1p')"
          if [[ "$version_line" != *"Version: ${release_version}, Commit: ${expected_commit},"* ]]; then
            echo "Release binary provenance mismatch: $version_line" >&2
            exit 1
          fi

          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          printf '%s\n' "${expected[@]}" checksums.txt | sort > expected-assets.txt

          python3 ../_release_tools/.github/scripts/publish-lts-assets.py \
            --repo "$GH_REPO" --tag "$RELEASE_TAG" \
            --assets "$PWD/expected-assets.txt" \
            --title-file "$PWD/release-title.txt" --notes "$PWD/release-notes.md" \
            --rewrite-notes "$REWRITE_RELEASE_NOTES"
