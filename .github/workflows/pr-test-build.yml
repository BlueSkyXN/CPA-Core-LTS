name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Validate GPT-5.6 Ultra compatibility
        run: |
          go test ./internal/registry ./internal/thinking \
            ./internal/runtime/executor ./sdk/api/handlers/openai \
            -run 'GPT56|Ultra|CodexWire' -count=1
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output

  docker-image-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build standard Core image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: cpa-core-lts:pr-smoke
          build-args: |
            VERSION=pr-smoke
            COMMIT=${{ github.sha }}
            BUILD_DATE=pr-smoke
      - name: Verify image binary name and banner
        shell: bash
        run: |
          set -euo pipefail
          cmd="$(docker image inspect cpa-core-lts:pr-smoke --format '{{json .Config.Cmd}}')"
          test "$cmd" = '["./sky-cpa-core-lts"]'
          docker run --rm --entrypoint /CLIProxyAPI/sky-cpa-core-lts cpa-core-lts:pr-smoke --help \
            >"$RUNNER_TEMP/sky-cpa-core-lts-help.txt" 2>&1
          grep -F 'sky-cpa-core-lts Version: pr-smoke' "$RUNNER_TEMP/sky-cpa-core-lts-help.txt"
          if grep -Fq 'CLIProxyAPI Version:' "$RUNNER_TEMP/sky-cpa-core-lts-help.txt"; then
            echo 'Legacy CLIProxyAPI product banner found in the standard image.' >&2
            exit 1
          fi

  provider-connectors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test CodeBuddy plugin
        working-directory: examples/plugin/codebuddy/go
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go build -buildmode=c-shared -o /tmp/cpa-provider-codebuddy.so .
      - name: Test Qoder plugin
        working-directory: examples/plugin/qoder/go
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go build -buildmode=c-shared -o /tmp/cpa-provider-qoder.so .

  credential-permissions-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify credential DACL hardening
        run: go test ./internal/misc -run TestOpenCredentialFileRestrictsAccessToCurrentUser -count=1
      - name: Verify Object Store Windows auth hardening
        run: go test -v ./internal/store -run 'TestSecureAuthFileWindows|TestRenderAuthStorageLocksWindowsStaging' -count=1
