name: translator-path-guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  ensure-no-translator-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect internal/translator changes
        id: changed-files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}" || git fetch --no-tags origin "${BASE_REF}"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${HEAD_SHA}" || git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fi
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- internal/translator)"
          if [[ -n "${changed}" ]]; then
            echo "Detected changes under internal/translator:"
            printf '%s\n' "${changed}"
            echo "any_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "any_changed=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Determine translator override
        id: translator-override
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          trusted=false
          case "${AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR)
              trusted=true
              ;;
          esac

          allowed=false
          if [[ "${trusted}" == "true" && "${HEAD_REPO}" == "${REPOSITORY}" && "${HEAD_REF}" == codex/sync-upstream-* ]]; then
            allowed=true
          elif [[ "${trusted}" == "true" && "${LABELS}" == *'"allow-translator-changes"'* ]]; then
            allowed=true
          fi

          echo "allowed=${allowed}" >> "${GITHUB_OUTPUT}"
      - name: Fail when restricted paths change
        if: steps.changed-files.outputs.any_changed == 'true' && steps.translator-override.outputs.allowed != 'true'
        run: |
          echo "Changes under internal/translator are not allowed in pull requests."
          echo "Use a trusted protected sync branch or the allow-translator-changes label when this is an approved maintenance change."
          exit 1
