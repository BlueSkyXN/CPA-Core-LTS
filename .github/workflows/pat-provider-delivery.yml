name: pat-provider-delivery

on:
  pull_request:
    paths:
      - 'Dockerfile.pat-providers'
      - 'docker-compose.pat-providers.yml'
      - 'examples/plugin/codebuddy/**'
      - 'examples/plugin/copilot/**'
      - 'examples/plugin/qoder/**'
      - 'examples/plugin/zcode-coding-plan/**'
      - 'docker-compose.coding-plan.yml'
      - '.dockerignore'
      - 'LICENSE'
      - 'examples/plugin/pat-providers.config.yaml'
      - 'scripts/*pat*providers*'
      - '.github/workflows/pat-provider-delivery.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Core release tag to build; empty builds the selected branch without publishing'
        type: string
        default: ''
      publish:
        description: 'Publish PAT image and attach provider artifacts to the existing release'
        type: boolean
        default: false
      resume_run_id:
        description: 'Reuse this repository run artifact ID source after a partial publish; empty rebuilds'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: inputs.resume_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 1
      - name: Source identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          if [ "$PUBLISH" = true ]; then
            printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9][A-Za-z0-9._-]*-lts-[A-Za-z0-9._-]+$'
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi
          {
            echo "CORE_SHA=$(git rev-parse HEAD)"
            echo "CORE_VERSION=${RELEASE_TAG:-dev}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Native provider regression tests
        run: |
          (cd examples/plugin/qoder/go && go test -count=1 ./... && go test -race -count=1 ./... && go vet ./...)
          (cd examples/plugin/copilot/go && go test -count=1 ./... && go test -race -count=1 ./... && go vet ./...)
          (cd examples/plugin/codebuddy/go && go test -race -count=1 ./... && go vet ./...)
          go test -count=1 ./test -run '^TestCodeBuddyDynamic'
          CP_NODE="$(command -v node)" go -C examples/plugin/zcode-coding-plan/go test -race -count=1 ./...
          go -C examples/plugin/zcode-coding-plan/go vet ./...
          sh examples/plugin/zcode-coding-plan/test-cpa.sh
      - name: Package layout and smoke fixture tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*pat_providers.py'
          CLI_PROXY_CONFIG_PATH="$PWD/examples/plugin/pat-providers.config.yaml" CPA_CODING_PLAN_PRIVATE_DIR="$RUNNER_TEMP" \
            docker compose -f docker-compose.pat-providers.yml -f docker-compose.coding-plan.yml config --quiet
      - name: Build optional image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pat-providers
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: cpa-pat:test
          build-args: |
            VERSION=${{ env.CORE_VERSION }}
            COMMIT=${{ env.CORE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha,scope=pat-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pat-${{ matrix.arch }}
      - name: Docker fixture smoke
        run: python3 scripts/smoke-pat-providers.py --image cpa-pat:test
      - name: Export installable artifacts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pat-providers
          target: artifacts
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=provider-artifacts
          build-args: |
            VERSION=${{ env.CORE_VERSION }}
            COMMIT=${{ env.CORE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha,scope=pat-${{ matrix.arch }}
      - name: Verify installable archives
        run: |
          set -eu
          cd provider-artifacts
          sha256sum -c provider-checksums.txt
          for archive in *.zip; do unzip -t "$archive"; done
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          bundle = json.loads(Path("pat-provider-bundle.json").read_text())
          assert set(bundle["plugins"]) == {"codebuddy", "copilot", "qoder", "zcode-coding-plan"}
          assert set(bundle["assets"]) == {path.name for path in Path(".").glob("*.zip")}
          for asset in bundle["assets"]:
              if asset.startswith("zcode-coding-plan_"):
                  with zipfile.ZipFile(asset) as package:
                      assert "zcode-coding-plan.so" in package.namelist()
                      assert package.read("zcode-coding-plan.so")[:4] == b"\\x7fELF"
                      assert json.loads(package.read("config.example.json"))["host_logging_disabled"] is False
          PY
      - name: Save image and platform metadata
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          docker save cpa-pat:test | gzip > provider-artifacts/image.tar.gz
          mv provider-artifacts/provider-checksums.txt "provider-artifacts/provider-checksums-${ARCH}.txt"
          mv provider-artifacts/pat-provider-bundle.json "provider-artifacts/pat-provider-bundle-${ARCH}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pat-provider-${{ matrix.arch }}
          path: provider-artifacts/
          retention-days: 7

  publish:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && (needs.build.result == 'success' || inputs.resume_run_id != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      IMAGE: ghcr.io/blueskyxn/cpa-core-lts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: pat-provider-*
          path: artifacts
          run-id: ${{ inputs.resume_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish verified images and packages
        run: |
          set -eu
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          source_commit="$(git rev-parse HEAD)"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            dir="artifacts/pat-provider-${arch}"
            test "$(jq -r .core_commit "$dir/pat-provider-bundle-${arch}.json")" = "$source_commit"
            test "$(jq -r .core_version "$dir/pat-provider-bundle-${arch}.json")" = "$RELEASE_TAG"
            test "$(jq -r .platform "$dir/pat-provider-bundle-${arch}.json")" = "linux/${arch}"
            jq -e '.plugins | keys == ["codebuddy", "copilot", "qoder", "zcode-coding-plan"]' "$dir/pat-provider-bundle-${arch}.json" >/dev/null
            coding_plan_version="$(jq -r '.plugins["zcode-coding-plan"]' "$dir/pat-provider-bundle-${arch}.json")"
            test -f "$dir/zcode-coding-plan_${coding_plan_version}_linux_${arch}.zip"
            (cd "$dir" && sha256sum -c "provider-checksums-${arch}.txt")
            docker load -i "$dir/image.tar.gz"
            tag="${IMAGE}:${RELEASE_TAG}-pat-providers-${arch}"
            docker tag cpa-pat:test "$tag"
            docker push "$tag"
            # Buildx 的 provenance.json 不是发行附件；两个架构会生成相同文件名。
            for asset in "$dir"/*.zip "$dir"/pat-provider-bundle-*.json "$dir"/provider-checksums-*.txt; do
              name="$(basename "$asset")"
              expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
              existing="$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets \
                --jq ".assets[] | select(.name == \"${name}\") | .digest")"
              if [ -n "$existing" ]; then
                test "$existing" = "$expected" || { echo "Existing asset digest mismatch: $name" >&2; exit 1; }
              else
                gh release upload "$RELEASE_TAG" "$asset" -R "$GITHUB_REPOSITORY"
              fi
            done
          done
          docker manifest create "${IMAGE}:${RELEASE_TAG}-pat-providers" \
            "${IMAGE}:${RELEASE_TAG}-pat-providers-amd64" "${IMAGE}:${RELEASE_TAG}-pat-providers-arm64"
          docker manifest push "${IMAGE}:${RELEASE_TAG}-pat-providers"
