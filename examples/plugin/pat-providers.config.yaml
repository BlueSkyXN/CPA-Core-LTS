# PAT 扩展镜像配置示例。先设置管理密钥和客户端 API key，再启动。
# Qoder 插件默认走原生 COSY 文本推理并内置中国区 endpoints，
# 国际区或私有网关实例可按需覆盖 direct_endpoint / openapi_endpoint 等字段。
host: ""
port: 8317
auth-dir: /root/.cli-proxy-api
remote-management:
  allow-remote: true
  secret-key: ""
  disable-control-panel: false
  panel-github-repository: https://github.com/BlueSkyXN/CPA-Panel-LTS
api-keys: []
usage-statistics-enabled: true
plugins:
  enabled: true
  dir: /opt/cpa-pat-plugins
  configs:
    cpa-provider-codebuddy:
      enabled: true
      permissions:
        auth-read: true
    cpa-provider-copilot:
      enabled: true
      permissions:
        auth-read: true
      # GitHub OAuth device 登录经 Management 的 /plugins/copilot/login-info 查询；
      # GHES 实例用 enterprise_domain 或 github_api_endpoint 覆盖默认 github.com/api.github.com。
    zcode-coding-plan:
      enabled: true
      # 账号 = 单文件内联凭据（auth 文件直接带 api_key/device_id），无需额外私有凭据挂载。
      # 审核并关闭原始请求/错误体日志后，把 host_logging_disabled 设为 true；撤销后阻止调用：
      # host_logging_disabled: true
      # 可选：upstream: zai 切国际区；models/model_limits 覆盖内置 glm-5.3/glm-5.3-flash 目录。
    cpa-provider-qoder:
      enabled: true
      permissions:
        auth-read: true
      # 自动读取账号启用的 Chat 模型（中国区默认 endpoints）；
      # 已有 direct_models 保持精确手动目录语义；配置后优先于动态目录。
      # direct_models:
      #   - id: qmodel_38max
      #     display_name: Qwen3.8-Max
