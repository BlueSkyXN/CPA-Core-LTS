# PAT 扩展镜像配置示例。先设置管理密钥和客户端 API key，再启动。
host: ""
port: 8317
auth-dir: /root/.cli-proxy-api
remote-management:
  allow-remote: true
  secret-key: ""
  disable-control-panel: false
  panel-github-repository: https://github.com/BlueSkyXN/CPA-Panel-LTS
api-keys: []
usage-statistics-enabled: true
plugins:
  enabled: true
  dir: /opt/cpa-pat-plugins
  configs:
    cpa-provider-codebuddy:
      enabled: true
      permissions:
        auth-read: true
    cpa-provider-qoder:
      enabled: true
      permissions:
        auth-read: true
      transport: direct_openai
      openapi_endpoint: https://openapi.qoder.com.cn
      direct_endpoint: https://gateway.qoder.com.cn/model/v1/chat/completions
      # 自动读取该账号的启用 Chat 模型；不自动发起计费的模型测试。
      direct_models_endpoint: https://gateway.qoder.com.cn/algo/api/v2/model/list
      direct_catalog_format: qoder
      # 已有 direct_models 保持精确手动目录语义；配置后优先于动态目录。
      # direct_models:
      #   - id: qmodel_38max
      #     display_name: Qwen3.8-Max
